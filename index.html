<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northline Bank</title><style>:root{--a:#60a5fa}*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f7f8fb;font:15px Inter,system-ui,sans-serif}header{position:sticky;top:0;background:#08090dee;backdrop-filter:blur(12px);border-bottom:1px solid #282e38;padding:16px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{color:white;text-decoration:none;font-weight:900}.brand small{display:block;color:#7f8999;font-size:10px}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#98a2b2;text-decoration:none;padding:9px 12px;border-radius:9px}nav a:hover{background:var(--a);color:#fff}main{max-width:1180px;margin:auto;padding:60px 5vw}h1{font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.06em;margin:0 0 15px}p{color:#9ca5b4;line-height:1.7}.heroimg{height:190px;border-radius:18px;background:linear-gradient(135deg,var(--a),#151922);display:grid;place-items:center;font-size:70px;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.grid>div,.card,.balance{background:#0f1218;border:1px solid #29303a;border-radius:16px;padding:20px}.grid b,.balance b{display:block;font-size:30px;margin-top:9px}.list{border:1px solid #29303a;border-radius:16px;overflow:hidden;margin-top:18px}.list>div{padding:15px 18px;border-bottom:1px solid #252b34;display:flex;justify-content:space-between;gap:12px}.chart{height:270px;display:flex;align-items:end;gap:7px;margin:25px 0}.chart i{flex:1;background:var(--a);border-radius:5px 5px 0 0}button{border:0;background:var(--a);color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin:5px 4px 5px 0}input,select{display:block;width:100%;background:#0a0d12;border:1px solid #303744;color:#fff;border-radius:9px;padding:11px;margin:7px 0 14px}@media(max-width:760px){header{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}main{padding:40px 5vw}}</style></head><body><header><a class="brand" href="?view=0">◉ Northline Bank<small>LOCAL DEMO · NO DATABASE</small></a><nav><a href="?view=0">Dashboard</a><a href="?view=1">Accounts</a><a href="?view=2">Transfer</a><a href="?view=3">Activity</a></nav></header><main id="app"></main><script>let bal=+(localStorage.bankBal||25000000),tx=JSON.parse(localStorage.bankTx||'[]');function money(n){return 'Rp '+n.toLocaleString('id-ID')}function save(){localStorage.bankBal=bal;localStorage.bankTx=JSON.stringify(tx)}function render(){let v=+(new URLSearchParams(location.search).get('view')||0);app.innerHTML=v===0?'<h1>Money, clearly organized.</h1><div class="balance"><small>AVAILABLE BALANCE</small><b>'+money(bal)+'</b><span>•••• 4821</span></div>':v===1?'<h1>Accounts</h1><div class="card"><b>Everyday Account</b><p>•••• 4821</p><strong>'+money(bal)+'</strong></div>':v===2?'<h1>Transfer</h1><form onsubmit="return transfer(event)"><input id="to" placeholder="Recipient" required><input id="amount" type="number" min="1" placeholder="Amount" required><button>Transfer</button></form><button onclick="deposit()">Demo deposit +Rp 1.000.000</button>':'<h1>Activity</h1><section class="list">'+tx.map(x=>'<div>'+x.type+' · '+x.to+' <b>'+money(x.amount)+'</b></div>').join('')+'</section>'}function transfer(e){e.preventDefault();let a=+amount.value;if(a<=0||a>bal)return alert('Saldo tidak cukup');bal-=a;tx.unshift({type:'Transfer',to:to.value,amount:-a});save();render();return false}function deposit(){bal+=1000000;tx.unshift({type:'Deposit',to:'Demo',amount:1000000});save();render()}render();</script></body></html>
